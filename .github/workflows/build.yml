name: build

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # The desktop client targets net10.0-windows, so build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore BankTeller.slnx
      - run: dotnet build BankTeller.slnx --no-restore --configuration Release
      - run: dotnet test --project tests/BankTeller.Tests --no-build --configuration Release
